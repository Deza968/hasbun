name: hasbun

services:
  postgres:
    image: postgres:16-alpine
    container_name: hasbun-postgres
    environment:
      POSTGRES_USER: hasbun
      POSTGRES_PASSWORD: hasbun
      POSTGRES_DB: hasbun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hasbun -d hasbun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hasbun-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hasbun-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: hasbun-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/hasbun
      "

  api:
    build:
      context: ../../apps/api
      target: dev
    container_name: hasbun-api
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hasbun:hasbun@postgres:5432/hasbun
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../../apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: hasbun-worker
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hasbun:hasbun@postgres:5432/hasbun
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../../apps/api/app:/app/api/app
      - ../../apps/worker:/app/worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-beat:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: hasbun-worker-beat
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hasbun:hasbun@postgres:5432/hasbun
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:latest
    container_name: hasbun-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      target: dev
    container_name: hasbun-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:1.27-alpine
    container_name: hasbun-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data: