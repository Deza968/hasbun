name: CI Backend

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hasbun
          POSTGRES_PASSWORD: hasbun
          POSTGRES_DB: hasbun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hasbun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app/ tests/

      - name: Mypy (tipos)
        run: mypy app/

      - name: Pytest (tests)
        run: pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://hasbun:hasbun@localhost:5432/hasbun_test
          SECRET_KEY: ci-secret